    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a06cff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a06cff" stop-opacity="0"/>
